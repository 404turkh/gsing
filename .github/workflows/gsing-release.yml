name: Release Gsing IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Gsing/**"
      - "Gsing.xcodeproj/**"
      - "AltSourceKit/**"
      - "IDeviceKit/**"
      - "NimbleKit/**"
      - "Zsign/**"
      - "makefile"
      - ".gitmodules"
      - ".github/workflows/gsing-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Gsing
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Build Gsing
        run: |
          make clean || true
          make Gsing

      - name: Verify IPA
        run: |
          test -f packages/Gsing.ipa
          ls -lh packages/Gsing.ipa

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \\([^;]*\\);/\\1/p' Gsing.xcodeproj/project.pbxproj | head -n 1)"
          test -n "$VERSION"
          TAG="v$VERSION"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" packages/Gsing.ipa --clobber
          else
            gh release create "$TAG" \
              packages/Gsing.ipa \
              --title "GSign $TAG" \
              --notes "GSign IPA release: Semi Local default for new installs, SSL update feedback, and preservation of downloaded SSL certificates."
          fi
